services:
  inventory:
    build: { context: ., target: backend }
    command: ["node", "dist/mcp/vehicle-inventory/src/server.js"]
    environment: { HOST: "0.0.0.0", INVENTORY_PORT: "8001" }
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  pricing:
    build: { context: ., target: backend }
    command: ["node", "dist/mcp/pricing/src/server.js"]
    environment: { HOST: "0.0.0.0", PRICING_PORT: "8002" }
    ports: ["127.0.0.1:8002:8002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  crm:
    build: { context: ., target: backend }
    command: ["node", "dist/mcp/crm/src/server.js"]
    environment: { HOST: "0.0.0.0", CRM_PORT: "8003" }
    ports: ["127.0.0.1:8003:8003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: { context: ., target: backend }
    environment:
      HOST: "0.0.0.0"
      API_PORT: "8080"
      LIONETTA_AGENT_MODE: "${LIONETTA_AGENT_MODE:-demo}"
      LIONETTA_MODEL_API_KEY: "${LIONETTA_MODEL_API_KEY:-}"
      LIONETTA_MODEL: "${LIONETTA_MODEL:-gpt-4.1-mini}"
      LIONETTA_MODEL_BASE_URL: "${LIONETTA_MODEL_BASE_URL:-https://api.openai.com/v1}"
      LIONETTA_INVENTORY_URL: "http://inventory:8001/mcp"
      LIONETTA_PRICING_URL: "http://pricing:8002/mcp"
      LIONETTA_CRM_URL: "http://crm:8003/mcp"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      inventory: { condition: service_healthy }
      pricing: { condition: service_healthy }
      crm: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: { context: ., target: web }
    environment: { API_ORIGIN: "http://api:8080" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
